name: Publish Android APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "ORG_GRADLE_PROJECT_FOCUSCOIN_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_FOCUSCOIN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focuscoin-release.jks"
            echo "ORG_GRADLE_PROJECT_FOCUSCOIN_STORE_FILE=$RUNNER_TEMP/focuscoin-release.jks" >> "$GITHUB_ENV"
            echo "FOCUSCOIN_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "FOCUSCOIN_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_FOCUSCOIN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FOCUSCOIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FOCUSCOIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$FOCUSCOIN_SIGNED" = "true" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FocusCoin.apk
            echo "이 APK는 저장소의 기존 서명 키로 서명되었습니다." > "$RUNNER_TEMP/focuscoin-release-notes.md"
          else
            gradle --no-daemon assembleDebug
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/FocusCoin.apk
            printf '%s\n' "이 APK는 설치 테스트용 debug 서명으로 빌드되었습니다. 추후 업데이트를 같은 앱으로 설치하려면 최초 배포 때 사용한 동일한 서명 키가 필요합니다. 서명이 다르면 앱을 제거한 뒤 설치해야 할 수 있으며, 앱 제거 시 기기에 저장된 FocusCoin 데이터가 삭제됩니다." > "$RUNNER_TEMP/focuscoin-release-notes.md"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FocusCoin ${{ github.ref_name }}
          generate_release_notes: true
          body_path: ${{ runner.temp }}/focuscoin-release-notes.md
          files: app/build/outputs/apk/release/FocusCoin.apk
